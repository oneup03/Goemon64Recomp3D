# Config file for Mystical Ninja Starring Goemon (USA) Recompilation.

[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs"
relocatable_sections_path = "mnsg.overlays.txt"
symbols_file_path = "Goemon64RecompSyms/mnsg.syms.toml"
rom_file_path = "mnsg.us.decompressed.z64"
trace_mode = true
bss_section_suffix = "_bss"

[patches]
stubs = [
]

ignored = [
]

# When osAiGetLength returns a number that exceeds the target amount of samples per frame, the calculation (target samples per frame - osAiGetLength()) will result in a negative number.
# When the clamping takes place to prevent a number of bytes that is too small, it doesn't take into account the negative number that resulted from the calculation.
# Not doing this results in a negative number being given to osAiSetNextBuffer causing a massive memory leak and crash (because a signed negative number is being read as unsigned).
[[patches.instruction]]
func = "func_80038210_38E10"
vram = 0x80038290
value = 0x00E3082A # sltu $at, $a3, $v1 -> slt $at, $a3, $v1

# 3DS: the Game page's "Audio voices" row (platform/3ds/main_3ds.cpp): fewer
# physical voices than the game's 16 cut the audio task's cost, which at the
# Old 3DS clock is 10-17 ms a task and too much for the SDK audio manager's
# one-task-per-retrace pipeline. The hook runs at the entry of the audio
# manager's creation (libaudio's amCreateAudioMgr), where a0 is the
# ALSynConfig and +4 its maxPVoices (alSynNew reads it there). The desktop
# build compiles it out.
[[patches.hook]]
func = "func_80037DC0_389C0"
text = """
#ifdef __3DS__
    { extern int g_goemon_audio_voices; if (g_goemon_audio_voices > 0 && g_goemon_audio_voices < MEM_W(0X4, ctx->r4)) MEM_W(0X4, ctx->r4) = g_goemon_audio_voices; }
#endif
"""
