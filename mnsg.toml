# Config file for Mystical Ninja Starring Goemon (USA) Recompilation.

[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs"
relocatable_sections_path = "mnsg.overlays.txt"
symbols_file_path = "Goemon64RecompSyms/mnsg.syms.toml"
rom_file_path = "mnsg.us.decompressed.z64"
trace_mode = true
bss_section_suffix = "_bss"

[patches]
stubs = [
]

ignored = [
]

# When osAiGetLength returns a number that exceeds the target amount of samples per frame, the calculation (target samples per frame - osAiGetLength()) will result in a negative number.
# When the clamping takes place to prevent a number of bytes that is too small, it doesn't take into account the negative number that resulted from the calculation.
# Not doing this results in a negative number being given to osAiSetNextBuffer causing a massive memory leak and crash (because a signed negative number is being read as unsigned).
[[patches.instruction]]
func = "func_80038210_38E10"
vram = 0x80038290
value = 0x00E3082A # sltu $at, $a3, $v1 -> slt $at, $a3, $v1

# 3DS: the Audio engine row's DSP synthesizer (rt64-3ds dsp_synth.h). Each
# of libaudio's synthesizer entry points tells rt64-3ds what the game asked
# for (from the arguments at the function's entry), and the function then
# runs as before, so the game's own bookkeeping is untouched. The desktop
# build compiles the calls out.
[[patches.hook]]
func = "alSynStartVoice"
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 0); }
#endif
"""
[[patches.hook]]
func = "alSynStartVoiceParams"
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 1); }
#endif
"""
[[patches.hook]]
func = "alSynStopVoice"
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 2); }
#endif
"""
[[patches.hook]]
func = "alSynSetVol"
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 3); }
#endif
"""
[[patches.hook]]
func = "alSynSetPitch"
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 4); }
#endif
"""
[[patches.hook]]
func = "alSynSetPan"
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 5); }
#endif
"""
[[patches.hook]]
func = "alSynSetFXMix"
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 6); }
#endif
"""
[[patches.hook]]
func = "alAudioFrame"
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 7); }
#endif
"""
# 3DS: the players' handlers have run (their alSyn* calls are what the DSP
# plays) and the command list is about to be built: with the voices on the
# DSP, or the sound off, nothing runs the list, so rt64-3ds takes the frame's
# updates itself, s3 (the samples left to build: s1 holds the synthesizer)
# goes to 0 and s4 (the list's end) past the one command it writes.
[[patches.hook]]
func = "alAudioFrame"
before_vram = 0x80047B40
text = """
#ifdef __3DS__
    { extern int recomp3ds_synth_skip_build(uint8_t*, uint32_t, int32_t, uint32_t);
      if (recomp3ds_synth_skip_build(rdram, (uint32_t)ctx->r17, (int32_t)ctx->r19, (uint32_t)ctx->r20)) { ctx->r19 = 0; ctx->r20 += 8; } }
#endif
"""

# 3DS: the ending's sepia photos. The game turns the frame it has just drawn
# into a 4-bit picture, reading the framebuffer in RDRAM: func_8022669C the
# last scene's (full screen), func_08000770 each credit's (320x208). The 3DS
# renderer never writes the framebuffer, so once a0 holds its address, rt64-3ds
# copies its last frame there (goemon3ds_photo_hook, platform/3ds/
# recomp_api_3ds.cpp), from the frames it keeps meanwhile: through the
# ending's last scene (its director in state 23; Redub replaces the director,
# func_8021F9CC, so the hook is on func_8020D2A0, which both versions call
# first, with the director in a0) and the credits (their director; its hook
# names the entry's address: the desktop's N64Recomp rejects an entry hook
# without one in a function below 0x80000000).
[[patches.hook]]
func = "func_8020D2A0_676C80"
text = """
#ifdef __3DS__
    { extern void goemon3ds_photo_hook(uint8_t*, void*, int); goemon3ds_photo_hook(rdram, ctx, 0); }
#endif
"""
[[patches.hook]]
func = "func_08001D2C_71F4FC"
before_vram = 0x08001D2C
text = """
#ifdef __3DS__
    { extern void goemon3ds_photo_hook(uint8_t*, void*, int); goemon3ds_photo_hook(rdram, ctx, 1); }
#endif
"""
[[patches.hook]]
func = "func_8022669C_69007C"
before_vram = 0x802266FC
text = """
#ifdef __3DS__
    { extern void goemon3ds_photo_hook(uint8_t*, void*, int); goemon3ds_photo_hook(rdram, ctx, 2); }
#endif
"""
[[patches.hook]]
func = "func_08000770_71DF40"
before_vram = 0x080007D0
text = """
#ifdef __3DS__
    { extern void goemon3ds_photo_hook(uint8_t*, void*, int); goemon3ds_photo_hook(rdram, ctx, 2); }
#endif
"""
